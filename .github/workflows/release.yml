name: Release

# Publishes a usable action tag.
#
# `dist/` is gitignored on main so pull requests never carry build output, but a
# consumer running `uses: futuremoney/fargate-deployer@v1` needs it present. This
# workflow builds on the release commit, commits `dist/` on a detached tree, and
# force-moves both the exact tag (v1.2.3) and the floating major tag (v1) onto
# that commit.

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.2.3'
        required: true

permissions:
  contents: write
  id-token: write # npm provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '22'
          cache: npm
          # Deliberately no `registry-url`. It makes setup-node write an .npmrc
          # containing `_authToken=${NODE_AUTH_TOKEN}`, and with no token set
          # npm sends an empty credential that takes precedence over OIDC — so
          # trusted publishing never gets a chance and the publish 401s.
          # npm already defaults to registry.npmjs.org.

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::package.json is $version but the tag is $TAG. Bump one of them."
            exit 1
          fi

      - name: Publish the tag with dist/
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add --force dist
          # A re-run checks out a tag that already carries dist/, and the
          # rebuild is identical — so there may be nothing to commit. That is
          # success, not failure.
          if git diff --cached --quiet; then
            echo "dist/ unchanged; reusing the existing release commit."
          else
            git commit --message "Release $TAG"
          fi

          git tag --force --annotate "$TAG" --message "$TAG"
          git tag --force --annotate "$major" --message "Latest $major release ($TAG)"
          git push --force origin "refs/tags/$TAG" "refs/tags/$major"

          echo "Published $TAG and moved $major to it." >> "$GITHUB_STEP_SUMMARY"

      # The action itself never needs npm — it runs from the tagged dist/. This
      # publish is for the CLI (`npx fargate-deployer diff`) and for importing
      # the constructs into someone's own CDK app.
      #
      # Authentication is npm trusted publishing (OIDC): no token, no secret.
      # It requires a one-time setup on npmjs.com naming this repository and
      # this workflow file — see docs/publishing.md.
      #
      # Deliberately ungated: a failure to publish should be a red release, not
      # a silently skipped step.
      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # setup-node still ships npm 10.x; trusted publishing needs 11.5.1+.
          npm install --global npm@latest
          npm --version

          # Belt and braces: any stray auth config would override OIDC, so
          # strip it rather than trust that nothing wrote one.
          if [ -f .npmrc ]; then
            sed -i '/_authToken/d; /always-auth/d' .npmrc
          fi

          # `npm error code ENEEDAUTH` has two very different causes and the
          # message does not distinguish them, so state which one applies:
          #   - OIDC unavailable -> the job lacks `id-token: write`
          #   - OIDC available but refused -> the trusted publisher on npmjs.com
          #     does not match this repository/workflow (every field is exact
          #     and case-sensitive, and npm does not validate it when saved)
          echo "--- trusted publishing preflight ---"
          echo "npm:            $(npm --version)"
          echo "node:           $(node --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token:     available (id-token: write is in effect)"
            echo "                so an auth failure below means the npmjs.com"
            echo "                trusted publisher does not match:"
            echo "                  owner/repo   ${GITHUB_REPOSITORY}"
            echo "                  workflow     $(basename "${GITHUB_WORKFLOW_REF%%@*}")"
            echo "                  environment  (none — must be blank on npmjs.com)"
          else
            echo "OIDC token:     MISSING — the job has no id-token: write, so npm"
            echo "                cannot use trusted publishing at all."
          fi
          echo "package repo:   $(node -p "require('./package.json').repository.url")"
          echo "------------------------------------"

          version="${TAG#v}"
          if npm view "fargate-deployer@$version" version >/dev/null 2>&1; then
            echo "fargate-deployer@$version is already on npm; nothing to do."
            exit 0
          fi

          # No --provenance flag: trusted publishing attaches the attestation
          # automatically, and passing it here is redundant.
          npm publish

          {
            echo ""
            echo "Published \`fargate-deployer@$version\` to npm."
          } >> "$GITHUB_STEP_SUMMARY"
