name: CI

on:
  # Every branch except main. A push to main is a merge of a PR that CI has
  # already run, so testing it again duplicates the work and the minutes.
  push:
    branches-ignore: [main]
  # Needed for pull requests from forks, where the push event fires in the
  # contributor's repository rather than here. Same-repo pull requests are
  # filtered out per job below, since their branch push already covers them.
  pull_request:
  # Kept so a run can still be triggered by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    # Skip on a same-repo pull request: the branch push already tested this
    # SHA. Fork pull requests have no push event here, so they still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  examples:
    name: Validate examples
    # Skip on a same-repo pull request: the branch push already tested this
    # SHA. Fork pull requests have no push event here, so they still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate every bundled example
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for manifest in examples/*.yaml; do
            echo "── $manifest"
            node dist/bin/cli.js validate --manifest "$manifest"
          done

  lint-actions:
    name: Lint workflows and action
    # Skip on a same-repo pull request: the branch push already tested this
    # SHA. Fork pull requests have no push event here, so they still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      # actionlint checks workflow syntax; it knows nothing about the
      # Marketplace's listing rules, which are otherwise only enforced at
      # publish time — after the tag and release already exist.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:action
