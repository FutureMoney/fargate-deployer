name: 'Fargate Deployer'
description: >-
  Build, push and deploy a container to AWS ECS Fargate from a declarative
  manifest — a long-running service behind an Application Load Balancer, or a
  set of EventBridge-scheduled tasks.
author: 'Corey Shaw'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  # -- what to deploy -------------------------------------------------------
  manifest:
    description: 'Path to the manifest file, e.g. deploy/prod.yaml'
    required: true
  image:
    description: >-
      Deploy this exact image instead of building one. Setting it skips the
      build and push steps entirely.
    required: false
    default: ''
  command:
    description: >-
      deploy | diff | synth | validate | destroy.
      Use `diff` on pull requests to preview changes, `validate` to check the
      manifest without touching AWS.
    required: false
    default: 'deploy'

  # -- AWS authentication ---------------------------------------------------
  role-to-assume:
    description: >-
      IAM role ARN to assume via GitHub OIDC. The recommended way to
      authenticate — no long-lived keys in your repository.
      Requires `permissions: id-token: write` on the job.
    required: false
    default: ''
  role-session-name:
    description: 'Session name for the assumed role.'
    required: false
    default: 'fargate-deployer'
  role-external-id:
    description: 'External ID, if the role trust policy requires one.'
    required: false
    default: ''
  role-duration-seconds:
    description: >-
      Lifetime of the assumed-role session. Raise it if a slow rollout plus
      wait-for-stability can outlast the default hour.
    required: false
    default: ''
  aws-access-key-id:
    description: >-
      Static access key. Use when OIDC is not available. May also be combined
      with `role-to-assume` to assume a role from those credentials.
    required: false
    default: ''
  aws-secret-access-key:
    description: 'Secret key that goes with `aws-access-key-id`.'
    required: false
    default: ''
  aws-session-token:
    description: >-
      Session token, required when the key and secret are temporary STS
      credentials rather than a long-lived IAM user.
    required: false
    default: ''
  aws-region:
    description: 'Override the region. Defaults to the manifest `region`.'
    required: false
    default: ''

  # -- image build ----------------------------------------------------------
  ecr-repository:
    description: 'ECR repository to push to. Defaults to the manifest `name`.'
    required: false
    default: ''
  create-ecr-repository:
    description: 'Create the ECR repository if it does not exist yet.'
    required: false
    default: 'true'
  image-tag:
    description: 'Tag for the built image. Defaults to the commit SHA.'
    required: false
    default: ''
  push-latest:
    description: 'Also tag the image `latest`.'
    required: false
    default: 'false'
  dockerfile:
    description: 'Path to the Dockerfile.'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Docker build context.'
    required: false
    default: '.'
  build-args:
    description: 'Build arguments, one KEY=VALUE per line.'
    required: false
    default: ''
  build-secrets:
    description: >-
      Build secrets, one KEY=VALUE per line, exposed to the build via
      `RUN --mount=type=secret,id=KEY`. Prefer this over build-args for
      anything sensitive — build args are visible in the image history.
    required: false
    default: ''
  platforms:
    description: >-
      Target platforms. Defaults to matching the manifest architecture
      (linux/arm64 when `task.runtimePlatform.cpuArchitecture: ARM64`).
    required: false
    default: ''
  provenance:
    description: >-
      Attach SLSA provenance to the pushed image. Off by default: the resulting
      multi-manifest index is not usable as an ECS task image.
    required: false
    default: 'false'

  # -- deployment behaviour -------------------------------------------------
  bootstrap:
    description: >-
      Run `cdk bootstrap` for the target account and region first. Needed once
      per account and region; leave it off afterwards.
    required: false
    default: 'false'
  wait-for-stability:
    description: 'After deploying a Service, wait until ECS reports it stable.'
    required: false
    default: 'true'
  cdk-args:
    description: 'Extra arguments passed straight through to the CDK CLI.'
    required: false
    default: ''
  working-directory:
    description: 'Directory that `manifest` and `context` are relative to.'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version used to run the deployer itself.'
    required: false
    default: '20'

outputs:
  image:
    description: 'Full image URI that was deployed'
    value: ${{ steps.image.outputs.uri }}
  image-digest:
    description: 'Digest of the pushed image (empty when the image was not built here)'
    value: ${{ steps.build.outputs.digest }}
  stack-name:
    description: 'CloudFormation stack name'
    value: ${{ steps.inspect.outputs.stack-name }}
  service-name:
    description: 'ECS service name (Service manifests only)'
    value: ${{ steps.inspect.outputs.name }}
  cluster:
    description: 'ECS cluster the stack deployed into'
    value: ${{ steps.inspect.outputs.cluster }}
  region:
    description: 'AWS region used'
    value: ${{ steps.inspect.outputs.region }}
  account:
    description: 'AWS account ID from the manifest'
    value: ${{ steps.inspect.outputs.account }}
  kind:
    description: 'Service or ScheduledTasks'
    value: ${{ steps.inspect.outputs.kind }}
  log-group:
    description: 'CloudWatch log group the tasks write to'
    value: ${{ steps.inspect.outputs.log-group }}
  alb-dns-name:
    description: >-
      DNS name of the load balancer this service sits behind — the target for a
      CNAME record. Empty when the service has no load balancer, or when the
      deploy role cannot call elasticloadbalancing:DescribeLoadBalancers.
    value: ${{ steps.dns.outputs.alb-dns-name }}
  alb-hosted-zone-id:
    description: >-
      Canonical hosted zone ID of the load balancer, for a Route 53 alias record
      (which is what an apex domain needs).
    value: ${{ steps.dns.outputs.alb-hosted-zone-id }}

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------- setup
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # The deployer's dependencies live with the action, so your repository needs
    # no Node.js toolchain, no lockfile and no CDK of its own.
    - name: Cache deployer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ github.action_path }}/node_modules
        key: fargate-deployer-${{ runner.os }}-node${{ inputs.node-version }}-${{ github.action_ref || 'local' }}

    - name: Install deployer
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail

        install() {
          if [ -f package-lock.json ]; then
            npm ci "$@" --no-audit --no-fund
          else
            npm install "$@" --no-audit --no-fund
          fi
        }

        if [ -f dist/bin/cli.js ]; then
          # A released tag ships a prebuilt dist/ and needs runtime deps only.
          if [ -d node_modules/aws-cdk-lib ]; then
            echo "Using cached deployer dependencies."
          else
            echo "Installing deployer runtime dependencies..."
            install --omit=dev
          fi
        else
          # A branch reference has no prebuilt dist/, so build it here.
          echo "No prebuilt dist/ — building the deployer from source."
          install
          npm run build
        fi

    # Validates the manifest and surfaces region/account before anything talks
    # to AWS, so a typo fails in seconds rather than after a build.
    - name: Read manifest
      id: inspect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/dist/bin/cli.js" inspect \
          --manifest "${{ inputs.manifest }}" | tee -a "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------ auth
    #
    # One step covers every combination, because the inputs it does not receive
    # are simply absent:
    #
    #   role-to-assume only ................. OIDC (needs id-token: write)
    #   key + secret ........................ static IAM user credentials
    #   key + secret + session token ........ temporary STS credentials
    #   key + secret + role-to-assume ....... assume a role from those keys
    #
    # Supplying none of them is also valid: the step is skipped and whatever
    # credentials the job already has — set by an earlier step, or by a
    # self-hosted runner's instance profile — are used as they are.
    - name: Configure AWS credentials
      if: >-
        inputs.command != 'validate' &&
        (inputs.role-to-assume != '' || inputs.aws-access-key-id != '')
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws-region || steps.inspect.outputs.region }}
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: ${{ inputs.role-session-name }}
        role-external-id: ${{ inputs.role-external-id }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-session-token: ${{ inputs.aws-session-token }}

    # ----------------------------------------------------------- build image
    - name: Log in to Amazon ECR
      id: ecr
      if: inputs.image == '' && inputs.command != 'validate'
      uses: aws-actions/amazon-ecr-login@v2

    - name: Ensure the ECR repository exists
      if: inputs.image == '' && inputs.create-ecr-repository == 'true' && inputs.command != 'validate'
      shell: bash
      env:
        REPOSITORY: ${{ inputs.ecr-repository || steps.inspect.outputs.name }}
        REGION: ${{ inputs.aws-region || steps.inspect.outputs.region }}
      run: |
        set -euo pipefail
        if aws ecr describe-repositories --region "$REGION" --repository-names "$REPOSITORY" >/dev/null 2>&1; then
          echo "Repository $REPOSITORY already exists."
        else
          echo "Creating ECR repository $REPOSITORY..."
          aws ecr create-repository \
            --region "$REGION" \
            --repository-name "$REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE >/dev/null
        fi

    - name: Resolve image URI
      id: image
      shell: bash
      env:
        GIVEN: ${{ inputs.image }}
        REGISTRY: ${{ steps.ecr.outputs.registry }}
        REPOSITORY: ${{ inputs.ecr-repository || steps.inspect.outputs.name }}
        TAG: ${{ inputs.image-tag || github.sha }}
      run: |
        set -euo pipefail
        if [ -n "$GIVEN" ]; then
          echo "uri=$GIVEN" >> "$GITHUB_OUTPUT"
        else
          echo "uri=${REGISTRY}/${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up QEMU
      if: inputs.image == '' && contains(inputs.platforms || steps.inspect.outputs.architecture, 'arm64')
      uses: docker/setup-qemu-action@v3

    - name: Set up Buildx
      if: inputs.image == '' && inputs.command != 'validate'
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      id: build
      if: inputs.image == '' && inputs.command != 'validate'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.working-directory }}/${{ inputs.context }}
        file: ${{ inputs.working-directory }}/${{ inputs.context }}/${{ inputs.dockerfile }}
        push: true
        platforms: ${{ inputs.platforms || steps.inspect.outputs.architecture }}
        provenance: ${{ inputs.provenance }}
        tags: |
          ${{ steps.image.outputs.uri }}
          ${{ inputs.push-latest == 'true' && steps.image.outputs.latest || '' }}
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.build-secrets }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # --------------------------------------------------------------- deploy
    - name: ${{ inputs.command }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FARGATE_DEPLOYER_MANIFEST: ${{ inputs.manifest }}
        FARGATE_DEPLOYER_IMAGE: ${{ steps.image.outputs.uri }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
        CDK_ARGS: ${{ inputs.cdk-args }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        args=("$COMMAND")
        if [ "$BOOTSTRAP" = "true" ]; then
          args+=(--bootstrap)
        fi
        if [ -n "$CDK_ARGS" ]; then
          # Deliberate word splitting: cdk-args is a list of flags.
          # shellcheck disable=SC2206
          args+=(-- $CDK_ARGS)
        fi
        node "${{ github.action_path }}/dist/bin/cli.js" "${args[@]}"

    - name: Wait for service stability
      if: >-
        inputs.command == 'deploy' &&
        inputs.wait-for-stability == 'true' &&
        steps.inspect.outputs.kind == 'Service'
      shell: bash
      env:
        REGION: ${{ inputs.aws-region || steps.inspect.outputs.region }}
        CLUSTER: ${{ steps.inspect.outputs.cluster }}
        SERVICE: ${{ steps.inspect.outputs.name }}
      run: |
        set -euo pipefail
        echo "Waiting for $SERVICE to reach a steady state..."
        if ! aws ecs wait services-stable --region "$REGION" --cluster "$CLUSTER" --services "$SERVICE"; then
          echo "::error::$SERVICE did not stabilise. Recent events:"
          aws ecs describe-services --region "$REGION" --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].events[0:10].[createdAt,message]' --output text
          exit 1
        fi

    # Turn the load balancer ARN — derived from the listener ARN at no API cost —
    # into the DNS name a user points their records at. Deliberately non-fatal:
    # the deploy has already succeeded by this point, and DescribeLoadBalancers
    # is a permission some deploy roles will not have.
    - name: Resolve load balancer DNS
      id: dns
      if: inputs.command == 'deploy' && steps.inspect.outputs.load-balancer-arn != ''
      shell: bash
      env:
        REGION: ${{ inputs.aws-region || steps.inspect.outputs.region }}
        LB_ARN: ${{ steps.inspect.outputs.load-balancer-arn }}
      run: |
        set -uo pipefail

        if ! described=$(aws elbv2 describe-load-balancers \
              --region "$REGION" --load-balancer-arns "$LB_ARN" \
              --query 'LoadBalancers[0].[DNSName,CanonicalHostedZoneId]' \
              --output text 2>&1); then
          echo "::warning::Could not read the load balancer DNS name, so the DNS" \
               "records are not shown below. Grant elasticloadbalancing:DescribeLoadBalancers" \
               "to the deploy role to enable it. ($described)"
          exit 0
        fi

        read -r dns_name zone_id <<< "$described"
        {
          echo "alb-dns-name=$dns_name"
          echo "alb-hosted-zone-id=$zone_id"
        } >> "$GITHUB_OUTPUT"

    - name: Job summary
      if: always() && inputs.command == 'deploy'
      shell: bash
      env:
        NAME: ${{ steps.inspect.outputs.name }}
        STACK: ${{ steps.inspect.outputs.stack-name }}
        KIND: ${{ steps.inspect.outputs.kind }}
        CLUSTER: ${{ steps.inspect.outputs.cluster }}
        ACCOUNT: ${{ steps.inspect.outputs.account }}
        REGION: ${{ inputs.aws-region || steps.inspect.outputs.region }}
        IMAGE: ${{ steps.image.outputs.uri }}
        LOG_GROUP: ${{ steps.inspect.outputs.log-group }}
        ALB_DNS: ${{ steps.dns.outputs.alb-dns-name }}
        ALB_ZONE: ${{ steps.dns.outputs.alb-hosted-zone-id }}
        HOST_HEADERS: ${{ steps.inspect.outputs.host-headers }}
      run: |
        {
          echo "### 🚀 $NAME"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Stack | \`$STACK\` |"
          echo "| Kind | $KIND |"
          echo "| Cluster | \`$CLUSTER\` |"
          echo "| Account / region | \`$ACCOUNT\` / \`$REGION\` |"
          echo "| Image | \`$IMAGE\` |"
          echo "| Logs | [\`$LOG_GROUP\`](https://$REGION.console.aws.amazon.com/cloudwatch/home?region=$REGION#logsV2:log-groups/log-group/$(echo "$LOG_GROUP" | sed 's|/|%252F|g')) |"

          # The records a user has to create to reach this service. Shown only
          # once the load balancer DNS name is known.
          if [ -n "$ALB_DNS" ]; then
            echo ""
            echo "#### DNS"
            echo ""
            if [ -n "$HOST_HEADERS" ]; then
              echo "Point each hostname at the load balancer:"
              echo ""
              echo "| Record | Type | Value |"
              echo "|---|---|---|"
              IFS=',' read -ra hosts <<< "$HOST_HEADERS"
              for host in "${hosts[@]}"; do
                echo "| \`$host\` | CNAME | \`$ALB_DNS\` |"
              done
              echo ""
              echo "An apex domain cannot hold a CNAME — use a Route 53 alias A record"
              echo "to hosted zone \`$ALB_ZONE\` instead."
            else
              echo "Load balancer \`$ALB_DNS\` (hosted zone \`$ALB_ZONE\`)."
              echo ""
              echo "This service is the listener's default action, so it answers on"
              echo "any hostname pointed at the load balancer."
            fi
          fi
        } >> "$GITHUB_STEP_SUMMARY"
