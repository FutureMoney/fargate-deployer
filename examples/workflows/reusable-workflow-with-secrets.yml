# Calling the reusable workflow instead of the action.
#
# Use this style if you already call reusable workflows and want AWS credentials
# to arrive through a `secrets:` block. An action cannot accept `secrets:`, so
# the wrapper workflow bridges the two.
#
# The action is the primary interface; this is here for callers migrating from a
# reusable workflow of their own. See examples/workflows/deploy.yml for the
# action form, which is four lines shorter.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  development:
    uses: futuremoney/fargate-deployer/.github/workflows/fargate-deploy.yml@v1
    with:
      manifest: deploy/development.yaml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEVELOPMENT }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEVELOPMENT }}

  production:
    needs: development
    uses: futuremoney/fargate-deployer/.github/workflows/fargate-deploy.yml@v1
    with:
      manifest: deploy/production.yaml
      environment: production # applies that environment's protection rules
      # Promote the exact image development ran rather than rebuilding.
      image: ${{ needs.development.outputs.image }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
